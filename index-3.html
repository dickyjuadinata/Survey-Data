<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4caf50">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3426/3426653.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Kuis Pintar Kelas 4 SD</title>
  <style>
    /* Mengunci layar agar pas 100% dari tinggi layar yang aktif */
html, body {
  height: 100dvh; /* dvh menyesuaikan tinggi secara dinamis saat keyboard muncul */
  margin: 0;
  padding: 0;
  overflow: hidden; /* Mencegah seluruh halaman bergeser ke atas/bawah */
  background-color: #f0f8ff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  box-sizing: border-box;
}

/* Kartu kuis yang fleksibel dan bisa di-scroll internal jika keyboard terlalu memakan tempat */
.card {
  background: white;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  max-width: 480px;
  width: 100%;
  max-height: 100dvh; /* Maksimal setinggi area yang terlihat */
  overflow-y: auto;   /* Scroll hanya terjadi di dalam kartu jika layar sangat sempit */
  box-sizing: border-box;
}

h1 { 
  color: #2c3e50; 
  font-size: 20px; 
  text-align: center; 
  margin-top: 0; 
  margin-bottom: 12px;
}

.form-group {
  margin-bottom: 12px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: #37474f;
  margin-bottom: 4px;
}

/* Ukuran kolom input & textarea */
input[type="text"], select, textarea {
  width: 100%;
  padding: 10px;
  border: 2px solid #b0bec5;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 16px; /* Tetap 16px agar tidak memicu auto-zoom browser */
  background-color: #fff;
}

textarea { 
  height: 60px; 
  resize: none; 
}

.score-bar {
  display: flex;
  justify-content: space-between;
  background: #f1f8e9;
  padding: 8px 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: bold;
  color: #33691e;
}

.question-box {
  background: #e1f5fe;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  font-weight: bold;
  color: #0277bd;
  line-height: 1.3;
  font-size: 14px;
}

button {
  width: 100%;
  background-color: #4caf50;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 6px;
  margin-bottom: 6px;
}

button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
button.btn-next { background-color: #0288d1; }
button.btn-restart { background-color: #ff9800; }

.result-box {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  display: none;
  line-height: 1.3;
  font-size: 13px;
}

.correct { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
.incorrect { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

#quizScreen, #finishScreen { display: none; }
.saving-text { font-size: 12px; color: #666; font-style: italic; margin-top: 6px; }
  </style>
</head>
<body>

<div class="card">
  <h1>Formulir Data Ruangan</h1>
  
  <form id="roomForm" onsubmit="simpanData(event)">
    <div class="form-group">
      <label for="namaRuangan">Nama Ruangan</label>
      <input type="text" id="namaRuangan" placeholder="Contoh: R. Rapat Utama" required>
    </div>

    <div class="form-group">
      <label for="luasRuangan">Luas Ruangan (m²)</label>
      <input type="number" id="luasRuangan" step="0.1" placeholder="Contoh: 25.5" required>
    </div>

    <div class="form-group">
      <label for="jenisSurface">Jenis Surface (Permukaan)</label>
      <select id="jenisSurface" required>
        <option value="">-- Pilih Jenis Surface --</option>
        <option value="Keramik">Keramik</option>
        <option value="Vinyl">Vinyl</option>
        <option value="Parquet/Kayu">Parquet / Kayu</option>
        <option value="Karpet">Karpet</option>
        <option value="Beton/Epoxy">Beton / Epoxy</option>
      </select>
    </div>

    <div class="form-group">
      <label for="catatan">Catatan Tambahan</label>
      <textarea id="catatan" placeholder="Kondisi permukaan, warna, dll."></textarea>
    </div>

    <button type="submit" id="btnSubmit">Simpan Data Ruangan 💾</button>
  </form>

  <div id="statusPesan" class="result-box"></div>
</div>

  <!-- LAYAR 2: TAMPILAN SOAL & PENILAIAN -->
  <div id="quizScreen">
    <div class="score-bar">
      <span>👤 <span id="dispNama">-</span></span>
      <span>Soal: <span id="dispProgres">0/0</span></span>
      <span>Nilai: <span id="dispNilai">0</span></span>
    </div>

    <div class="question-box" id="soalText">Memuat soal...</div>

    <textarea id="jawabanAnak" placeholder="Tulis jawabanmu di sini..."></textarea>

    <button id="btnKirim" onclick="periksaJawaban()">Kirim Jawaban</button>
    <button id="btnLanjut" class="btn-next" onclick="tampilkanSoalBerikutnya()" style="display: none;">Soal Berikutnya ➡️</button>

    <div id="resultBox" class="result-box"></div>
  </div>

  <!-- LAYAR 3: HASIL AKHIR -->
  <div id="finishScreen" style="text-align: center;">
    <h2>Selesai! 🎉</h2>
    <p>Hebat sekali, <strong id="finishNama"></strong>!</p>
    <p style="font-size: 18px;">Nilai Akhirmu:</p>
    <h1 style="font-size: 48px; color: #2e7d32; margin: 10px 0;" id="finishNilai">0</h1>
    <p id="finishDetail" style="color: #555;"></p>
    <p id="statusSimpan" class="saving-text">Menyimpan nilai ke Google Sheets...</p>
    <button class="btn-restart" onclick="ulangKuis()">Main Lagi 🔄</button>
  </div>
</div>

<script>
  const WEB_APP_URL = "URL_WEB_APP_GOOGLE_SCRIPT_ANDA";

function simpanData(e) {
  e.preventDefault();

  const btn = document.getElementById("btnSubmit");
  const statusPesan = document.getElementById("statusPesan");
  
  btn.disabled = true;
  btn.innerText = "Menyimpan...";

  const payload = {
    namaRuangan: document.getElementById("namaRuangan").value,
    luasRuangan: document.getElementById("luasRuangan").value,
    jenisSurface: document.getElementById("jenisSurface").value,
    catatan: document.getElementById("catatan").value
  };

  fetch(WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    statusPesan.style.display = "block";
    statusPesan.className = "result-box correct";
    statusPesan.innerText = "✅ Data ruangan berhasil disimpan ke Sheets!";
    
    // Reset form setelah berhasil
    document.getElementById("roomForm").reset();
    btn.disabled = false;
    btn.innerText = "Simpan Data Ruangan 💾";
  })
  .catch((error) => {
    statusPesan.style.display = "block";
    statusPesan.className = "result-box incorrect";
    statusPesan.innerText = "❌ Gagal menyimpan data: " + error.message;
    btn.disabled = false;
    btn.innerText = "Simpan Data Ruangan 💾";
  });
}
  // Registrasi PWA Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('PWA Service Worker terdaftar:', reg.scope))
      .catch((err) => console.error('PWA Registrasi gagal:', err));
  });
}
</script>

</body>
</html>
