<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Data Form</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 600px;
      padding: 24px;
    }
    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      color: #111827;
    }
    
    /* Navigasi Tab */
    .tab-nav {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: none;
      border: none;
      font-weight: 600;
      font-size: 14px;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: #16a34a;
      border-bottom-color: #16a34a;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      color: #111827;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    textarea {
      resize: vertical;
      height: 70px;
    }
    .btn-submit {
      width: 100%;
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #15803d;
    }
    .btn-reload {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-reload:hover {
      background-color: #1d4ed8;
    }
    .btn-edit {
      background-color: #eab308;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 4px;
    }
    .btn-delete {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f9fafb;
      font-weight: 600;
      color: #4b5563;
    }
    .empty-row {
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Room Data Form</h2>

    <!-- Menu Tab Navigasi -->
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('inputTab')">Input Form</button>
      <button class="tab-btn" onclick="switchTab('listTab')">Room List & Config</button>
    </div>

    <form id="roomForm" onsubmit="event.preventDefault(); submitData();">
      
      <!-- TAB 1: FORM INPUT -->
      <div id="inputTab" class="tab-content active">
        <div class="form-group">
          <label for="building">Building</label>
          <input type="text" id="building" placeholder="Contoh: main" required>
        </div>

        <div class="form-group">
          <label for="floor">Floor</label>
          <input type="text" id="floor" placeholder="Contoh: ground" required>
        </div>

        <div class="form-group">
          <label for="roomID">Room ID / Room Name</label>
          <input type="text" id="roomID" placeholder="Contoh: lobby" required>
        </div>

        <div class="form-group">
          <label for="area">Area (m2)</label>
          <input type="number" id="area" placeholder="Contoh: 100" step="any" required>
        </div>

        <!-- INPUT SURFACE TYPE DENGAN MATCHING AUTOCOMPLETE -->
        <div class="form-group">
          <label for="surface">Surface Type</label>
          <input type="text" id="surface" list="surfaceOptions" placeholder="Ketik jenis surface..." required autocomplete="off">
          <datalist id="surfaceOptions">
            <option value="Ceramic"></option>
            <option value="Carpet"></option>
            <option value="Terazzo"></option>
            <option value="Marble"></option>
            <option value="Granite"></option>
            <option value="Terracotta"></option>
            <option value="Vinyl"></option>
            <option value="Rubber"></option>
            <option value="Soil"></option>
            <option value="Con block"></option>
            <option value="Asphalt"></option>
            <option value="Parquete"></option>
            <option value="Epoxy"></option>
            <option value="Metal"></option>
            <option value="Stone"></option>
            <option value="Cement/ Concrete"></option>
          </datalist>
        </div>

        <div class="form-group">
          <label for="notes">Notes / Remarks</label>
          <textarea id="notes" placeholder="Surface condition, color, etc."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnSave">
          Save Room Data
        </button>
      </div>

      <!-- TAB 2: ROOM LIST & PROJECT CONFIG -->
      <div id="listTab" class="tab-content">
        <div class="form-group">
          <label for="surveyorName">User / Surveyor Name</label>
          <input type="text" id="surveyorName" placeholder="Contoh: Dicky" onchange="loadProjectDropdown()">
        </div>

        <div class="form-group">
          <label for="projectName">Project Name (Select Existing)</label>
          <select id="projectName">
            <option value="">-- Pilih Project --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="newProjectName">Custom / New Project Name</label>
          <input type="text" id="newProjectName" placeholder="Contoh: test 5">
        </div>

        <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">

        <h3>Registered Room List</h3>
        <button type="button" class="btn-reload" onclick="fetchRoomData()">Reload List</button>

        <table>
          <thead>
            <tr>
              <th>Building</th>
              <th>Floor</th>
              <th>Room</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="roomTableBody">
            <tr>
              <td colspan="4" class="empty-row">Klik Reload List untuk memuat data</td>
            </tr>
          </tbody>
        </table>
      </div>

    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDGfaC2Ldi19dGuwAP2jg7hTFe6POdpBykclVf90ZaZd1xsosaP6MQiFa4IQqblMMt2A/exec";

    let activeEditingRow = null;

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      if (tabId === 'inputTab') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
      }
    }

    async function loadProjectDropdown() {
      const dropdown = document.getElementById("projectName");
      dropdown.innerHTML = `<option value="">Loading projects...</option>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getProjects`);
        const result = await response.json();

        if (result.status === "success" && result.projects) {
          dropdown.innerHTML = `<option value="">-- Pilih Project --</option>`;
          result.projects.forEach(proj => {
            const opt = document.createElement("option");
            opt.value = proj;
            opt.innerText = proj;
            dropdown.appendChild(opt);
          });
        } else {
          dropdown.innerHTML = `<option value="">Tidak ada proyek ditemukan</option>`;
        }
      } catch (err) {
        dropdown.innerHTML = `<option value="">Gagal memuat proyek</option>`;
      }
    }

    function getSelectedProject() {
      const customProj = document.getElementById("newProjectName").value.trim();
      const selectProj = document.getElementById("projectName").value.trim();
      const surveyor   = document.getElementById("surveyorName").value.trim();

      if (customProj !== "") return customProj;
      if (selectProj !== "") return selectProj;
      return surveyor !== "" ? surveyor : "Default";
    }

    async function submitData() {
      const btnSave = document.getElementById("btnSave");
      const activeProject = getSelectedProject();

      const payload = {
        action: activeEditingRow ? "editRow" : "create",
        rowIndex: activeEditingRow,
        surveyorName: document.getElementById("surveyorName").value,
        newProjectName: activeProject,
        building: document.getElementById("building").value,
        floor: document.getElementById("floor").value,
        roomID: document.getElementById("roomID").value,
        area: document.getElementById("area").value,
        surface: document.getElementById("surface").value,
        notes: document.getElementById("notes").value
      };

      try {
        btnSave.disabled = true;
        btnSave.innerText = "Saving Data...";

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert(`Berhasil! ${result.message}`);
          activeEditingRow = null;

          // Hanya bersihkan Room ID, Area, Surface, dan Notes. Building & Floor tetap dipertahankan.
          document.getElementById("roomID").value = "";
          document.getElementById("area").value = "";
          document.getElementById("surface").value = "";
          document.getElementById("notes").value = "";

          fetchRoomData();
        } else {
          alert("Gagal menyimpan data: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi saat menyimpan data.");
        console.error(err);
      } finally {
        btnSave.disabled = false;
        btnSave.innerText = "Save Room Data";
      }
    }

    async function fetchRoomData() {
      const tableBody = document.getElementById("roomTableBody");
      const activeProject = getSelectedProject();

      tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Loading data...</td></tr>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?projectName=${encodeURIComponent(activeProject)}`);
        const result = await response.json();

        if (result.status === "success" && result.data && result.data.length > 0) {
          tableBody.innerHTML = "";
          result.data.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${item.building}</td>
              <td>${item.floor}</td>
              <td>${item.roomID}</td>
              <td>
                <button class="btn-edit" type="button" onclick="editRow('${item.rowIndex}', '${item.building}', '${item.floor}', '${item.roomID}', '${item.area}', '${item.surface}')">Edit</button>
                <button class="btn-delete" type="button" onclick="deleteRow('${item.rowIndex}')">Delete</button>
              </td>
            `;
            tableBody.appendChild(tr);
          });
        } else {
          tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Data tidak ditemukan pada proyek "${activeProject}"</td></tr>`;
        }
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Gagal memuat data</td></tr>`;
      }
    }

    async function deleteRow(rowIndex) {
      if (!confirm("Apakah Anda yakin ingin menghapus data ruangan ini?")) return;

      const activeProject = getSelectedProject();

      const payload = {
        action: "deleteRow",
        rowIndex: rowIndex,
        newProjectName: activeProject
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("Data berhasil dihapus!");
          fetchRoomData();
        } else {
          alert("Gagal menghapus data: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi saat menghapus data.");
      }
    }

    function editRow(rowIndex, building, floor, roomID, area, surface) {
      activeEditingRow = rowIndex;
      document.getElementById("building").value = building;
      document.getElementById("floor").value = floor;
      document.getElementById("roomID").value = roomID;
      document.getElementById("area").value = area;
      document.getElementById("surface").value = surface;
      switchTab('inputTab');
    }

    // Panggil saat pertama dimuat
    window.onload = function() {
      loadProjectDropdown();
    };
  </script>
</body>
</html>
