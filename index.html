<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#4caf50">
  <title>Room Data Form</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3426/3426653.png">
  
  <style>
    html, body {
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f0f8ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
      max-height: 100dvh;
      overflow-y: auto;
      box-sizing: border-box;
    }

    h1 { 
      color: #2c3e50; 
      font-size: 20px; 
      text-align: center; 
      margin-top: 0; 
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #37474f;
      margin-bottom: 4px;
    }

    input[type="text"], 
    input[type="number"], 
    select, 
    textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #b0bec5;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: #fff;
    }

    textarea { 
      height: 60px; 
      resize: none; 
    }

    .input-proyek-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      box-sizing: border-box;
    }

    .btn-submit { background-color: #4caf50; color: white; }
    .btn-edit { background-color: #ff9800; color: white; display: none; }
    .btn-view { background-color: #0288d1; color: white; }

    button:disabled { 
      background-color: #9e9e9e; 
      cursor: not-allowed; 
    }

    .result-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      line-height: 1.3;
      font-size: 13px;
      text-align: center;
    }

    .correct { 
      background-color: #e8f5e9; 
      color: #2e7d32; 
      border: 1px solid #a5d6a7; 
    }
    
    .incorrect { 
      background-color: #ffebee; 
      color: #c62828; 
      border: 1px solid #ef9a9a; 
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Room Data Form</h1>
  
  <form id="roomForm" onsubmit="simpanData(event, 'insert')">
    
    <!-- NAMA USER / SURVEYOR -->
    <div class="form-group">
      <label for="namaUser">User / Surveyor Name</label>
      <input type="text" id="namaUser" placeholder="e.g. Dicky" required onchange="fetchProyekUser()">
    </div>

    <!-- NAMA PROYEK -->
    <div class="form-group">
      <label for="namaProyek">Project Name</label>
      <div class="input-proyek-wrapper">
        <select id="selectProyek" onchange="syncNamaProyek(this.value)">
          <option value="">-- Type User Name First --</option>
        </select>
        <input type="text" id="namaProyek" placeholder="Or type new project name..." required>
      </div>
    </div>

    <!-- NAMA GEDUNG (BUILDING) -->
    <div class="form-group">
      <label for="namaGedung">Building</label>
      <input type="text" id="namaGedung" placeholder="e.g. Building A / Main Tower" required>
    </div>

    <!-- NAMA RUANGAN (ROOM ID / NAME) -->
    <div class="form-group">
      <label for="namaRuangan">Room ID / Room Name</label>
      <input type="text" id="namaRuangan" placeholder="e.g. Main Meeting Room" required>
    </div>

    <!-- LUAS RUANGAN (AREA m2) -->
    <div class="form-group">
      <label for="luasRuangan">Area (m²)</label>
      <input type="number" id="luasRuangan" step="0.1" placeholder="e.g. 25.5" required>
    </div>

    <!-- JENIS SURFACE -->
    <div class="form-group">
      <label for="jenisSurface">Surface Type</label>
      <select id="jenisSurface" required>
        <option value="">-- Select Surface Type --</option>
        <option value="Ceramic">Ceramic</option>
        <option value="Carpet">Carpet</option>
        <option value="Terazzo">Terazzo</option>
        <option value="Marble">Marble</option>
        <option value="Granite">Granite</option>
        <option value="Terracotta">Terracotta</option>
        <option value="Vinyl">Vinyl</option>
        <option value="Rubber">Rubber</option>
        <option value="Soil">Soil</option>
        <option value="Con block">Con block</option>
        <option value="Asphalt">Asphalt</option>
        <option value="Parquete">Parquete</option>
        <option value="Epoxy">Epoxy</option>
        <option value="Metal">Metal</option>
        <option value="Stone">Stone</option>
        <option value="Cement/ Concrete">Cement/ Concrete</option>
      </select>
    </div>

    <!-- CATATAN / REMARKS -->
    <div class="form-group">
      <label for="catatan">Notes / Remarks</label>
      <textarea id="catatan" placeholder="Surface condition, color, etc."></textarea>
    </div>

    <div class="btn-group">
      <button type="submit" id="btnSubmit" class="btn-submit">Save Room Data 💾</button>
      <button type="button" id="btnEdit" class="btn-edit" onclick="kembaliKeDataTerakhir()">✏ Restore & Edit Last Entry</button>
      <button type="button" id="btnView" class="btn-view" onclick="bukaFileSpreadsheet()">📊 View & Edit Spreadsheet File</button>
    </div>
  </form>

  <div id="statusPesan" class="result-box"></div>
</div>

<script>
  // GANTI DENGAN WEB APP URL MILIK ANDA
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzDGfaC2Ldi19dGuwAP2jg7hTFe6POdpBykclVf90ZaZd1xsosaP6MQiFa4IQqblMMt2A/exec";

  let dataTerakhir = null;

  function loadSavedInputs() {
    const savedUser = localStorage.getItem("saved_namaUser");
    const savedProyek = localStorage.getItem("saved_namaProyek");
    const savedGedung = localStorage.getItem("saved_namaGedung");

    if (savedUser) {
      document.getElementById("namaUser").value = savedUser;
      fetchProyekUser();
    }
    if (savedProyek) document.getElementById("namaProyek").value = savedProyek;
    if (savedGedung) document.getElementById("namaGedung").value = savedGedung;
  }

  function fetchProyekUser() {
    const namaUser = document.getElementById("namaUser").value.trim();
    const selectProyek = document.getElementById("selectProyek");

    if (!namaUser) {
      selectProyek.innerHTML = '<option value="">-- Type User Name First --</option>';
      return;
    }

    selectProyek.innerHTML = '<option value="">Loading projects...</option>';

    fetch(WEB_APP_URL + "?action=getProjects&namaUser=" + encodeURIComponent(namaUser))
      .then(res => res.json())
      .then(data => {
        selectProyek.innerHTML = '<option value="">-- Select Existing Project --</option>';
        if (data.status === "success" && data.projects.length > 0) {
          data.projects.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p;
            opt.textContent = p;
            selectProyek.appendChild(opt);
          });
        } else {
          selectProyek.innerHTML = '<option value="">No projects found</option>';
        }
      })
      .catch(() => {
        selectProyek.innerHTML = '<option value="">Failed to load projects</option>';
      });
  }

  function syncNamaProyek(val) {
    if (val) {
      document.getElementById("namaProyek").value = val;
      localStorage.setItem("saved_namaProyek", val);
    }
  }

  function simpanData(e, mode = 'insert') {
    if (e) e.preventDefault();

    const btn = document.getElementById("btnSubmit");
    const statusPesan = document.getElementById("statusPesan");
    
    btn.disabled = true;
    btn.innerText = "Saving...";

    const payload = {
      action: mode === 'update' ? 'updateLast' : 'insert',
      namaUser: document.getElementById("namaUser").value.trim(),
      namaProyek: document.getElementById("namaProyek").value.trim(),
      namaGedung: document.getElementById("namaGedung").value.trim(),
      namaRuangan: document.getElementById("namaRuangan").value.trim(),
      luasRuangan: document.getElementById("luasRuangan").value,
      jenisSurface: document.getElementById("jenisSurface").value,
      catatan: document.getElementById("catatan").value.trim()
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      dataTerakhir = { ...payload };

      statusPesan.style.display = "block";
      statusPesan.className = "result-box correct";
      statusPesan.innerText = mode === 'update' ? "✅ Revision updated successfully!" : "✅ Room data saved successfully to Sheets!";
      
      document.getElementById("namaRuangan").value = "";
      document.getElementById("luasRuangan").value = "";
      document.getElementById("jenisSurface").value = "";
      document.getElementById("catatan").value = "";
      
      const form = document.getElementById("roomForm");
      form.onsubmit = function(ev) { simpanData(ev, 'insert'); };

      document.getElementById("btnEdit").style.display = "block";

      btn.disabled = false;
      btn.innerText = "Save Room Data 💾";

      // Re-fetch daftar proyek setelah file baru dibuat
      setTimeout(fetchProyekUser, 1500);
    })
    .catch((error) => {
      statusPesan.style.display = "block";
      statusPesan.className = "result-box incorrect";
      statusPesan.innerText = "❌ Failed to save data: " + error.message;
      btn.disabled = false;
      btn.innerText = "Save Room Data 💾";
    });
  }

  function kembaliKeDataTerakhir() {
    if (!dataTerakhir) {
      alert("No new data saved in this session.");
      return;
    }

    document.getElementById("namaUser").value = dataTerakhir.namaUser;
    document.getElementById("namaProyek").value = dataTerakhir.namaProyek;
    document.getElementById("namaGedung").value = dataTerakhir.namaGedung;
    document.getElementById("namaRuangan").value = dataTerakhir.namaRuangan;
    document.getElementById("luasRuangan").value = dataTerakhir.luasRuangan;
    document.getElementById("jenisSurface").value = dataTerakhir.jenisSurface;
    document.getElementById("catatan").value = dataTerakhir.catatan;

    const statusPesan = document.getElementById("statusPesan");
    statusPesan.style.display = "block";
    statusPesan.className = "result-box incorrect";
    statusPesan.innerText = "⚠️ Revision Mode: Update your data then click 'Save Room Data'.";

    const form = document.getElementById("roomForm");
    form.onsubmit = function(e) { simpanData(e, 'update'); };
  }

  function bukaFileSpreadsheet() {
    const namaUser = document.getElementById("namaUser").value.trim();
    const namaProyek = document.getElementById("namaProyek").value.trim();

    if (!namaUser) {
      alert("Please enter User Name first!");
      return;
    }

    const btnView = document.getElementById("btnView");
    btnView.disabled = true;
    btnView.innerText = "Opening File...";

    const fetchUrl = WEB_APP_URL + "?action=openSpreadsheet&namaUser=" + encodeURIComponent(namaUser) + "&namaProyek=" + encodeURIComponent(namaProyek);

    fetch(fetchUrl)
      .then(res => res.json())
      .then(data => {
        btnView.disabled = false;
        btnView.innerText = "📊 View & Edit Spreadsheet File";

        if (data.status === "success" && data.url) {
          window.open(data.url, "_blank");
        } else {
          alert(data.message || "Failed to retrieve Spreadsheet URL.");
        }
      })
      .catch(err => {
        btnView.disabled = false;
        btnView.innerText = "📊 View & Edit Spreadsheet File";
        alert("An error occurred: " + err.message);
      });
  }

  document.addEventListener("DOMContentLoaded", function() {
    loadSavedInputs();

    document.getElementById("namaUser")?.addEventListener("input", function(e) {
      localStorage.setItem("saved_namaUser", e.target.value);
    });

    document.getElementById("namaProyek")?.addEventListener("input", function(e) {
      localStorage.setItem("saved_namaProyek", e.target.value);
    });

    document.getElementById("namaGedung")?.addEventListener("input", function(e) {
      localStorage.setItem("saved_namaGedung", e.target.value);
    });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
        .catch((err) => console.error('PWA Registration failed:', err));
    });
  }
</script>

</body>
</html>
