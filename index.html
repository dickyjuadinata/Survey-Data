<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Data Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 850px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    .user-info { font-size: 14px; color: #10b981; font-weight: 600; margin-top: 4px; }
    .btn-logout { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .tabs { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 24px; }
    .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 600; color: #6b7280; font-size: 14px; transition: all 0.2s; }
    .tab.active { color: #10b981; border-bottom: 2px solid #10b981; margin-bottom: -2px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; background-color: #fafafa; }
    input:focus, select:focus, textarea:focus { border-color: #10b981; background-color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
    .btn-submit { width: 100%; background-color: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-submit:hover { background-color: #059669; }
    .btn-download { background-color: #059669; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-download:hover { background-color: #047857; }
    .table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }
    th { background-color: #f9fafb; font-weight: 600; color: #374151; }
    .btn-action { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; margin-right: 4px; color: white; }
    .btn-edit { background-color: #f59e0b; }
    .btn-duplicate { background-color: #8b5cf6; }
    .btn-delete { background-color: #ef4444; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 24px; border-radius: 8px; width: 320px; }
    .actions-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="card" id="loginCard">
    <h2 style="margin-bottom: 16px;">Login / Register</h2>
    <div class="form-group">
      <label>Surveyor Name / Username</label>
      <input type="text" id="loginUser" placeholder="e.g., Dicky">
    </div>
    <div class="form-group">
      <label>PIN / Password</label>
      <input type="password" id="loginPin" placeholder="Enter PIN">
    </div>
    <button class="btn-submit" onclick="handleLogin()">Login / Register</button>
  </div>

  <div class="card" id="mainCard" style="display: none;">
    <div class="header">
      <div>
        <h3>Room Data Form</h3>
        <div class="user-info" id="displayUser">User: -</div>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabInput" onclick="switchTab('input')">Input Form</div>
      <div class="tab" id="tabList" onclick="switchTab('list')">Room List & Config</div>
    </div>

    <!-- TAB INPUT FORM -->
    <div id="viewInput">
      <div class="form-group">
        <label>Building</label>
        <input type="text" id="inputBuilding" placeholder="Main">
      </div>
      <div class="form-group">
        <label>Floor</label>
        <input type="text" id="inputFloor" placeholder="2nd">
      </div>
      <div class="form-group">
        <label>Room ID / Room Name</label>
        <input type="text" id="inputRoom" placeholder="e.g., Lobby">
      </div>
      <div class="form-group">
        <label>Area (m²)</label>
        <input type="number" step="any" id="inputArea" placeholder="e.g., 100">
      </div>
      <div class="form-group">
        <label>Surface Type</label>
        <input type="text" id="inputSurface" placeholder="Type surface type...">
      </div>
      <div class="form-group">
        <label>Notes / Remarks</label>
        <textarea id="inputNotes" rows="3" placeholder="Surface condition, color, etc."></textarea>
      </div>
      <button class="btn-submit" id="btnSave" onclick="saveData()">Save Room Data</button>
    </div>

    <!-- TAB LIST & CONFIG -->
    <div id="viewList" style="display: none;">
      <div class="form-group">
        <label>Project Name (Select Existing)</label>
        <select id="selectProject" onchange="loadProjectData()"></select>
      </div>
      <div class="form-group">
        <label>Custom / New Project Name</label>
        <input type="text" id="customProject" placeholder="e.g., New Project">
      </div>

      <h4 style="margin-top: 20px; margin-bottom: 10px;">Registered Room List</h4>
      
      <div class="actions-bar">
        <button class="btn-logout" style="background:#2563eb; color:white;" onclick="loadProjectData()">Reload List</button>
        <button class="btn-download" id="btnDownloadSheet" onclick="downloadAreasSheet()" style="display:none;">
          ⬇ Download Areas Sheet (.xlsx)
        </button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Building</th>
              <th>Floor</th>
              <th>Room ID / Name</th>
              <th>Area (m²)</th>
              <th>Surface Type</th>
              <th>Notes / Remarks</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="7" style="text-align:center;">No data available</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL DUPLICATE -->
  <div class="modal" id="duplicateModal">
    <div class="modal-content">
      <h4 style="margin-bottom: 12px;">Duplicate Room</h4>
      <div class="form-group">
        <label>Target Floor Name</label>
        <input type="text" id="modalFloorName" placeholder="e.g., 3rd Floor">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="btn-submit" style="background:#6b7280;" onclick="closeDuplicateModal()">Cancel</button>
        <button class="btn-submit" onclick="submitDuplicate()">Duplicate</button>
      </div>
    </div>
  </div>

  <script>
    // MASUKKAN WEB APP URL DARI GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxB34aWp3Wqf9pIs95-x0RAt-0QzB-m9gG6Yy6_yZ2z/exec";

    let currentUser = "";
    let currentPin = "";
    let activeEditRowIndex = null;
    let duplicateSourceIndex = null;
    let currentSpreadsheetId = "";
    let currentSheetId = "";

    function switchTab(tab) {
      if (tab === 'input') {
        document.getElementById('viewInput').style.display = 'block';
        document.getElementById('viewList').style.display = 'none';
        document.getElementById('tabInput').classList.add('active');
        document.getElementById('tabList').classList.remove('active');
      } else {
        document.getElementById('viewInput').style.display = 'none';
        document.getElementById('viewList').style.display = 'block';
        document.getElementById('tabList').classList.add('active');
        document.getElementById('tabInput').classList.remove('active');
        fetchProjects();
      }
    }

    async function handleLogin() {
      const user = document.getElementById('loginUser').value.trim();
      const pin = document.getElementById('loginPin').value.trim();
      if (!user || !pin) return alert("Fill username and PIN");

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', surveyorName: user, userPin: pin })
      }).then(r => r.json());

      if (res.status === 'success') {
        currentUser = user;
        currentPin = pin;
        document.getElementById('displayUser').innerText = "User: " + currentUser;
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('mainCard').style.display = 'block';
      } else {
        alert(res.message);
      }
    }

    function handleLogout() {
      currentUser = "";
      currentPin = "";
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('mainCard').style.display = 'none';
    }

    async function fetchProjects() {
      const url = `${SCRIPT_URL}?action=getProjects&surveyorName=${encodeURIComponent(currentUser)}&userPin=${encodeURIComponent(currentPin)}`;
      const res = await fetch(url).then(r => r.json());
      
      const select = document.getElementById('selectProject');
      select.innerHTML = "";
      
      if (res.status === 'success' && res.projects) {
        res.projects.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          select.appendChild(opt);
        });
        if (res.projects.length > 0) loadProjectData();
      }
    }

    async function loadProjectData() {
      const proj = document.getElementById('selectProject').value || currentUser;
      const url = `${SCRIPT_URL}?action=getData&surveyorName=${encodeURIComponent(currentUser)}&userPin=${encodeURIComponent(currentPin)}&projectName=${encodeURIComponent(proj)}`;
      
      const res = await fetch(url).then(r => r.json());
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = "";

      if (res.status === 'success' && res.data && res.data.length > 0) {
        currentSpreadsheetId = res.spreadsheetId || "";
        currentSheetId = res.sheetId || "";

        if (currentSpreadsheetId && currentSheetId) {
          document.getElementById('btnDownloadSheet').style.display = 'inline-flex';
        } else {
          document.getElementById('btnDownloadSheet').style.display = 'none';
        }

        res.data.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.building || ''}</td>
            <td>${item.floor || ''}</td>
            <td>${item.roomID || ''}</td>
            <td>${item.area || ''}</td>
            <td>${item.surface || ''}</td>
            <td>${item.notes || ''}</td>
            <td>
              <button class="btn-action btn-edit" onclick="editRow(${item.rowIndex}, '${item.building}', '${item.floor}', '${item.roomID}', '${item.area}', '${item.surface}', \`${item.notes || ''}\`)">Edit</button>
              <button class="btn-action btn-duplicate" onclick="openDuplicateModal(${item.rowIndex})">Duplicate</button>
              <button class="btn-action btn-delete" onclick="deleteRow(${item.rowIndex})">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } else {
        document.getElementById('btnDownloadSheet').style.display = 'none';
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No data available</td></tr>`;
      }
    }

    function downloadAreasSheet() {
      if (!currentSpreadsheetId || !currentSheetId) {
        return alert("Spreadsheet info not found.");
      }
      // URL ekspor langsung sheet 'Areas' ke format .xlsx
      const downloadUrl = `https://docs.google.com/spreadsheets/d/${currentSpreadsheetId}/export?format=xlsx&gid=${currentSheetId}`;
      window.open(downloadUrl, '_blank');
    }

    async function saveData() {
      const payload = {
        action: activeEditRowIndex ? 'editRow' : 'saveData',
        rowIndex: activeEditRowIndex,
        surveyorName: currentUser,
        userPin: currentPin,
        projectName: document.getElementById('selectProject').value || currentUser,
        newProjectName: document.getElementById('customProject').value,
        building: document.getElementById('inputBuilding').value,
        floor: document.getElementById('inputFloor').value,
        roomID: document.getElementById('inputRoom').value,
        area: document.getElementById('inputArea').value,
        surface: document.getElementById('inputSurface').value,
        notes: document.getElementById('inputNotes').value
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      }).then(r => r.json());

      if (res.status === 'success') {
        alert(res.message);
        resetForm();
        switchTab('list');
      } else {
        alert(res.message);
      }
    }

    function editRow(index, building, floor, room, area, surface, notes) {
      activeEditRowIndex = index;
      document.getElementById('inputBuilding').value = building;
      document.getElementById('inputFloor').value = floor;
      document.getElementById('inputRoom').value = room;
      document.getElementById('inputArea').value = area;
      document.getElementById('inputSurface').value = surface;
      document.getElementById('inputNotes').value = notes;
      
      document.getElementById('btnSave').innerText = "Update Room Data (Row " + index + ")";
      switchTab('input');
    }

    async function deleteRow(index) {
      if (!confirm("Are you sure you want to clear row " + index + "?")) return;
      
      const payload = {
        action: 'deleteRow',
        rowIndex: index,
        surveyorName: currentUser,
        userPin: currentPin,
        projectName: document.getElementById('selectProject').value || currentUser
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      }).then(r => r.json());

      alert(res.message);
      loadProjectData();
    }

    function openDuplicateModal(index) {
      duplicateSourceIndex = index;
      document.getElementById('modalFloorName').value = "";
      document.getElementById('duplicateModal').style.display = 'flex';
    }

    function closeDuplicateModal() {
      document.getElementById('duplicateModal').style.display = 'none';
    }

    async function submitDuplicate() {
      const targetFloor = document.getElementById('modalFloorName').value.trim();
      if (!targetFloor) return alert("Target Floor name is required.");

      const payload = {
        action: 'duplicateRow',
        rowIndex: duplicateSourceIndex,
        targetFloor: targetFloor,
        surveyorName: currentUser,
        userPin: currentPin,
        projectName: document.getElementById('selectProject').value || currentUser
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      }).then(r => r.json());

      alert(res.message);
      closeDuplicateModal();
      loadProjectData();
    }

    function resetForm() {
      activeEditRowIndex = null;
      document.getElementById('inputBuilding').value = "";
      document.getElementById('inputFloor').value = "";
      document.getElementById('inputRoom').value = "";
      document.getElementById('inputArea').value = "";
      document.getElementById('inputSurface').value = "";
      document.getElementById('inputNotes').value = "";
      document.getElementById('btnSave').innerText = "Save Room Data";
    }
  </script>
</body>
</html>
