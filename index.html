<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Data Form</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 600px;
      padding: 24px;
    }
    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      color: #111827;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      color: #111827;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    textarea {
      resize: vertical;
      height: 70px;
    }
    .btn-submit {
      width: 100%;
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #15803d;
    }
    .btn-reload {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-reload:hover {
      background-color: #1d4ed8;
    }
    .btn-edit {
      background-color: #eab308;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 4px;
    }
    .btn-delete {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .table-container {
      margin-top: 24px;
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f9fafb;
      font-weight: 600;
      color: #4b5563;
    }
    .empty-row {
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Room Data Form</h2>

    <form id="roomForm" onsubmit="event.preventDefault(); submitData();">
      
      <div class="form-group">
        <label for="surveyorName">User / Surveyor Name</label>
        <input type="text" id="surveyorName" placeholder="Contoh: Dicky" required>
      </div>

      <div class="form-group">
        <label for="projectName">Project Name</label>
        <select id="projectName" disabled>
          <option value="">Failed to load projects</option>
        </select>
      </div>

      <div class="form-group">
        <label for="newProjectName">Custom / New Project Name</label>
        <input type="text" id="newProjectName" placeholder="Contoh: test 5">
      </div>

      <div class="form-group">
        <label for="building">Building</label>
        <input type="text" id="building" placeholder="Contoh: main" required>
      </div>

      <div class="form-group">
        <label for="floor">Floor</label>
        <input type="text" id="floor" placeholder="Contoh: ground" required>
      </div>

      <div class="form-group">
        <label for="roomID">Room ID / Room Name</label>
        <input type="text" id="roomID" placeholder="Contoh: lobby" required>
      </div>

      <div class="form-group">
        <label for="area">Area (m²)</label>
        <input type="number" id="area" placeholder="Contoh: 100" step="any" required>
      </div>

      <div class="form-group">
        <label for="surface">Surface Type</label>
        <input type="text" id="surface" placeholder="Contoh: Ceramic Tile" required>
      </div>

      <div class="form-group">
        <label for="notes">Notes / Remarks</label>
        <textarea id="notes" placeholder="Surface condition, color, etc."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSave">
        Save Room Data 💾
      </button>
    </form>

    <div class="table-container">
      <h3>Registered Room List</h3>
      <button type="button" class="btn-reload" onclick="fetchRoomData()">🔄 Reload List</button>

      <table>
        <thead>
          <tr>
            <th>Building</th>
            <th>Floor</th>
            <th>Room</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="roomTableBody">
          <tr>
            <td colspan="4" class="empty-row">Click reload to load data</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // GANTI SCRIPT_URL DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYOUR_DEPLOYMENT_ID_HERE/exec";

    let activeEditingRow = null;

    async function submitData() {
      const btnSave = document.getElementById("btnSave");
      const surveyor = document.getElementById("surveyorName").value;
      const customProject = document.getElementById("newProjectName").value;
      const selectedProject = customProject.trim() !== "" ? customProject.trim() : surveyor;

      const payload = {
        action: activeEditingRow ? "editRow" : "create",
        rowIndex: activeEditingRow,
        surveyorName: surveyor,
        newProjectName: selectedProject,
        building: document.getElementById("building").value,
        floor: document.getElementById("floor").value,
        roomID: document.getElementById("roomID").value,
        area: document.getElementById("area").value,
        surface: document.getElementById("surface").value,
        notes: document.getElementById("notes").value
      };

      try {
        btnSave.disabled = true;
        btnSave.innerText = "Saving Data...";

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert(`Berhasil! ${result.message}`);
          activeEditingRow = null;
          document.getElementById("notes").value = "";
          fetchRoomData();
        } else {
          alert("Gagal menyimpan data: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi saat menyimpan data.");
        console.error(err);
      } finally {
        btnSave.disabled = false;
        btnSave.innerText = "Save Room Data 💾";
      }
    }

    async function fetchRoomData() {
      const tableBody = document.getElementById("roomTableBody");
      const surveyor = document.getElementById("surveyorName").value;
      const customProject = document.getElementById("newProjectName").value;
      const selectedProject = customProject.trim() !== "" ? customProject.trim() : surveyor;

      tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Loading data...</td></tr>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?projectName=${encodeURIComponent(selectedProject)}`);
        const result = await response.json();

        if (result.status === "success" && result.data && result.data.length > 0) {
          tableBody.innerHTML = "";
          result.data.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${item.building}</td>
              <td>${item.floor}</td>
              <td>${item.roomID}</td>
              <td>
                <button class="btn-edit" onclick="editRow('${item.rowIndex}', '${item.building}', '${item.floor}', '${item.roomID}', '${item.area}', '${item.surface}', '${item.notes}')">Edit</button>
                <button class="btn-delete" onclick="deleteRow('${item.rowIndex}')">Delete</button>
              </td>
            `;
            tableBody.appendChild(tr);
          });
        } else {
          tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">No data found in project "1. Analysis - ${selectedProject}"</td></tr>`;
        }
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="4" class="empty-row">Failed to fetch data</td></tr>`;
        console.error(err);
      }
    }

    async function deleteRow(rowIndex) {
      if (!confirm("Apakah Anda yakin ingin menghapus data ruangan ini?")) return;

      const surveyor = document.getElementById("surveyorName").value;
      const customProject = document.getElementById("newProjectName").value;
      const selectedProject = customProject.trim() !== "" ? customProject.trim() : surveyor;

      const payload = {
        action: "deleteRow",
        rowIndex: rowIndex,
        newProjectName: selectedProject
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("Data berhasil dihapus!");
          fetchRoomData();
        } else {
          alert("Gagal menghapus data: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi saat menghapus data.");
        console.error(err);
      }
    }

    function editRow(rowIndex, building, floor, roomID, area, surface, notes) {
      activeEditingRow = rowIndex;
      document.getElementById("building").value = building;
      document.getElementById("floor").value = floor;
      document.getElementById("roomID").value = roomID;
      document.getElementById("area").value = area;
      document.getElementById("surface").value = surface;
      document.getElementById("notes").value = notes;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
