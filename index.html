<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#4caf50">
  <title>Formulir Data Ruangan</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3426/3426653.png">
  
  <style>
    /* Mengunci layar agar pas 100% dari tinggi layar yang aktif */
    html, body {
      height: 100dvh; /* dvh menyesuaikan tinggi secara dinamis saat keyboard muncul */
      margin: 0;
      padding: 0;
      overflow: hidden; /* Mencegah seluruh halaman bergeser ke atas/bawah */
      background-color: #f0f8ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
    }

    /* Kartu form yang fleksibel dan dapat di-scroll internal jika keyboard memakan tempat */
    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
      max-height: 100dvh;
      overflow-y: auto;
      box-sizing: border-box;
    }

    h1 { 
      color: #2c3e50; 
      font-size: 20px; 
      text-align: center; 
      margin-top: 0; 
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #37474f;
      margin-bottom: 4px;
    }

    /* Ukuran kolom input & textarea */
    input[type="text"], 
    input[type="number"], 
    select, 
    textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #b0bec5;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px; /* 16px agar tidak memicu auto-zoom otomatis di iOS/Android */
      background-color: #fff;
    }

    textarea { 
      height: 70px; 
      resize: none; 
    }

    button {
      width: 100%;
      background-color: #4caf50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
      margin-bottom: 6px;
    }

    button:disabled { 
      background-color: #9e9e9e; 
      cursor: not-allowed; 
    }

    .result-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      line-height: 1.3;
      font-size: 13px;
      text-align: center;
    }

    .correct { 
      background-color: #e8f5e9; 
      color: #2e7d32; 
      border: 1px solid #a5d6a7; 
    }
    
    .incorrect { 
      background-color: #ffebee; 
      color: #c62828; 
      border: 1px solid #ef9a9a; 
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Formulir Data Ruangan</h1>
  
  <form id="roomForm" onsubmit="simpanData(event)">
    <div class="form-group">
      <label for="namaRuangan">Nama Ruangan</label>
      <input type="text" id="namaRuangan" placeholder="Contoh: R. Rapat Utama" required>
    </div>

    <div class="form-group">
      <label for="luasRuangan">Luas Ruangan (m²)</label>
      <input type="number" id="luasRuangan" step="0.1" placeholder="Contoh: 25.5" required>
    </div>

    <div class="form-group">
      <label for="jenisSurface">Jenis Surface (Permukaan)</label>
      <select id="jenisSurface" required>
        <option value="">-- Pilih Jenis Surface --</option>
        <option value="Keramik">Keramik</option>
        <option value="Vinyl">Vinyl</option>
        <option value="Parquet/Kayu">Parquet / Kayu</option>
        <option value="Karpet">Karpet</option>
        <option value="Beton/Epoxy">Beton / Epoxy</option>
      </select>
    </div>

    <div class="form-group">
      <label for="catatan">Catatan Tambahan</label>
      <textarea id="catatan" placeholder="Kondisi permukaan, warna, dll."></textarea>
    </div>

    <button type="submit" id="btnSubmit">Simpan Data Ruangan 💾</button>
  </form>

  <div id="statusPesan" class="result-box"></div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzDGfaC2Ldi19dGuwAP2jg7hTFe6POdpBykclVf90ZaZd1xsosaP6MQiFa4IQqblMMt2A/exec";

  function simpanData(e) {
    e.preventDefault();

    const btn = document.getElementById("btnSubmit");
    const statusPesan = document.getElementById("statusPesan");
    
    btn.disabled = true;
    btn.innerText = "Menyimpan...";

    const payload = {
      namaRuangan: document.getElementById("namaRuangan").value,
      luasRuangan: document.getElementById("luasRuangan").value,
      jenisSurface: document.getElementById("jenisSurface").value,
      catatan: document.getElementById("catatan").value
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusPesan.style.display = "block";
      statusPesan.className = "result-box correct";
      statusPesan.innerText = "✅ Data ruangan berhasil disimpan ke Sheets!";
      
      // Reset formulir setelah berhasil
      document.getElementById("roomForm").reset();
      btn.disabled = false;
      btn.innerText = "Simpan Data Ruangan 💾";
    })
    .catch((error) => {
      statusPesan.style.display = "block";
      statusPesan.className = "result-box incorrect";
      statusPesan.innerText = "❌ Gagal menyimpan data: " + error.message;
      btn.disabled = false;
      btn.innerText = "Simpan Data Ruangan 💾";
    });
  }

  // Registrasi Service Worker PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('PWA Service Worker terdaftar:', reg.scope))
        .catch((err) => console.error('PWA Registrasi gagal:', err));
    });
  }
</script>

</body>
</html>
