<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Data Ruangan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a73e8;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1a73e8;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn-submit {
      background-color: #1a73e8;
      color: white;
    }

    .btn-submit:hover {
      background-color: #1557b0;
    }

    .btn-edit {
      background-color: #fbbc04;
      color: #202124;
    }

    .btn-edit:hover {
      background-color: #f2a900;
    }

    .btn-download {
      background-color: #34a853;
      color: white;
    }

    .btn-download:hover {
      background-color: #2d8e47;
    }

    #statusMessage {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .status-success {
      background-color: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }

    .status-error {
      background-color: #fce8e6;
      color: #c5221f;
      border: 1px solid #fad2cf;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Formulir Data Ruangan</h2>
    
    <form id="roomForm">
      <!-- NAMA USER / SURVEYOR -->
      <div class="form-group">
        <label for="namaUser">Nama User / Surveyor</label>
        <input type="text" id="namaUser" placeholder="Contoh: Budi" required>
      </div>

      <!-- NAMA PROYEK -->
      <div class="form-group">
        <label for="namaProyek">Nama Proyek</label>
        <input type="text" id="namaProyek" placeholder="Contoh: Gedung Perkantoran A" required>
      </div>

      <!-- NAMA GEDUNG -->
      <div class="form-group">
        <label for="namaGedung">Nama Gedung</label>
        <input type="text" id="namaGedung" placeholder="Contoh: Gedung Utama / Menara B" required>
      </div>

      <!-- NAMA RUANGAN -->
      <div class="form-group">
        <label for="namaRuangan">Nama Ruangan</label>
        <input type="text" id="namaRuangan" placeholder="Contoh: R. Rapat Utama" required>
      </div>

      <!-- LUAS RUANGAN -->
      <div class="form-group">
        <label for="luasRuangan">Luas Ruangan (m²)</label>
        <input type="number" id="luasRuangan" step="0.01" placeholder="Contoh: 25.5" required>
      </div>

      <!-- JENIS SURFACE -->
      <div class="form-group">
        <label for="jenisSurface">Jenis Surface / Permukaan</label>
        <select id="jenisSurface" required>
          <option value="">-- Pilih Jenis Surface --</option>
          <option value="Keramik">Keramik</option>
          <option value="Vinyl">Vinyl</option>
          <option value="Parquet">Parquet</option>
          <option value="Karpet">Karpet</option>
          <option value="Epoxy">Epoxy</option>
          <option value="Marmer/Granit">Marmer / Granit</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>

      <!-- CATATAN / KETERANGAN -->
      <div class="form-group">
        <label for="catatan">Catatan / Keterangan</label>
        <textarea id="catatan" rows="3" placeholder="Tambahkan catatan jika ada..."></textarea>
      </div>

      <!-- TOMBOL AKSI -->
      <button type="submit" id="btnSubmit" class="btn-submit">💾 Simpan Data</button>
      <button type="button" id="btnEdit" class="btn-edit" onclick="kembalikanDataTerakhir()">✏ Kembalikan & Edit Data Terakhir</button>
      <button type="button" class="btn-download" onclick="unduhSpreadsheet()">📥 Unduh Spreadsheet (Excel)</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    // URL Web App dari Google Apps Script Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwy4_7vU2W-030yvjH-1g_3d5a4g6h7j8k9l0/exec"; // Masukkan URL Deploy Web App Anda jika berbeda
    const SPREADSHEET_ID = "1WAGOVfSe8hx2dGeFeO_GWnFcQ1JwU-R8qpZhfy-SVWw";

    let lastSubmittedData = null;
    let isEditMode = false;

    // --- 1. LOCAL STORAGE (MEMORI TERKAIT REFRESH) ---
    function loadSavedInputs() {
      const savedUser = localStorage.getItem("saved_namaUser");
      const savedProyek = localStorage.getItem("saved_namaProyek");
      const savedGedung = localStorage.getItem("saved_namaGedung");

      if (savedUser && document.getElementById("namaUser")) {
        document.getElementById("namaUser").value = savedUser;
      }
      if (savedProyek && document.getElementById("namaProyek")) {
        document.getElementById("namaProyek").value = savedProyek;
      }
      if (savedGedung && document.getElementById("namaGedung")) {
        document.getElementById("namaGedung").value = savedGedung;
      }
    }

    // --- 2. HANYA KOSONGKAN DETAIL RUANGAN ---
    function resetRoomInputsOnly() {
      document.getElementById("namaRuangan").value = "";
      document.getElementById("luasRuangan").value = "";
      document.getElementById("jenisSurface").value = "";
      document.getElementById("catatan").value = "";
      
      // Kembalikan status tombol ke simpan biasa
      isEditMode = false;
      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.textContent = "💾 Simpan Data";
      btnSubmit.style.backgroundColor = "#1a73e8";
    }

    // --- 3. PROSES SIMPAN / REVISI DATA ---
    document.getElementById("roomForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const payload = {
        action: isEditMode ? 'updateLast' : 'insert',
        namaUser: document.getElementById("namaUser").value.trim(),
        namaProyek: document.getElementById("namaProyek").value.trim(),
        namaGedung: document.getElementById("namaGedung").value.trim(),
        namaRuangan: document.getElementById("namaRuangan").value.trim(),
        luasRuangan: document.getElementById("luasRuangan").value.trim(),
        jenisSurface: document.getElementById("jenisSurface").value,
        catatan: document.getElementById("catatan").value.trim()
      };

      showStatus("Mengirim data...", "info");

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Mengatasi CORS bawaan Google Apps Script
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        // Simpan data terakhir di memori JS untuk fitur edit lokal
        lastSubmittedData = { ...payload };

        showStatus(isEditMode ? "Data berhasil diperbarui!" : "Data berhasil disimpan!", "success");
        resetRoomInputsOnly();
      })
      .catch(error => {
        console.error("Error:", error);
        showStatus("Gagal mengirim data. Periksa koneksi internet Anda.", "error");
      });
    });

    // --- 4. KEMBALIKAN & EDIT DATA TERAKHIR ---
    function kembalikanDataTerakhir() {
      if (!lastSubmittedData) {
        showStatus("Belum ada data terakhir yang dikirim pada sesi ini.", "error");
        return;
      }

      document.getElementById("namaUser").value = lastSubmittedData.namaUser;
      document.getElementById("namaProyek").value = lastSubmittedData.namaProyek;
      document.getElementById("namaGedung").value = lastSubmittedData.namaGedung;
      document.getElementById("namaRuangan").value = lastSubmittedData.namaRuangan;
      document.getElementById("luasRuangan").value = lastSubmittedData.luasRuangan;
      document.getElementById("jenisSurface").value = lastSubmittedData.jenisSurface;
      document.getElementById("catatan").value = lastSubmittedData.catatan;

      isEditMode = true;
      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.textContent = "🔄 Perbarui Data Terakhir (Revisi)";
      btnSubmit.style.backgroundColor = "#e67e22";

      showStatus("Data terakhir dimuat ke formulir. Silakan ubah lalu klik 'Perbarui Data Terakhir'.", "info");
    }

    // --- 5. DIRECT DOWNLOAD SPREADSHEET ---
    function unduhSpreadsheet() {
      const downloadUrl = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + "/export?format=xlsx";

      const a = document.createElement("a");
      a.href = downloadUrl;
      a.setAttribute("download", "Areas_Data.xlsx");
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // --- 6. TAMPILKAN PESAN STATUS ---
    function showStatus(message, type) {
      const statusDiv = document.getElementById("statusMessage");
      statusDiv.textContent = message;
      statusDiv.style.display = "block";

      if (type === "success") {
        statusDiv.className = "status-success";
      } else if (type === "error") {
        statusDiv.className = "status-error";
      } else {
        statusDiv.className = "";
        statusDiv.style.backgroundColor = "#e8f0fe";
        statusDiv.style.color = "#1a73e8";
        statusDiv.style.border = "1px solid #aecbfa";
      }

      setTimeout(() => {
        if (type === "success") {
          statusDiv.style.display = "none";
        }
      }, 4000);
    }

    // --- 7. EVENT LISTENER SAAT HALAMAN SELESAI DIMUAT ---
    document.addEventListener("DOMContentLoaded", function() {
      // Load nilai tersimpan
      loadSavedInputs();

      // Simpan nilai ke localStorage secara real-time saat user mengetik
      document.getElementById("namaUser")?.addEventListener("input", function(e) {
        localStorage.setItem("saved_namaUser", e.target.value);
      });

      document.getElementById("namaProyek")?.addEventListener("input", function(e) {
        localStorage.setItem("saved_namaProyek", e.target.value);
      });

      document.getElementById("namaGedung")?.addEventListener("input", function(e) {
        localStorage.setItem("saved_namaGedung", e.target.value);
      });
    });
  </script>
</body>
</html>
