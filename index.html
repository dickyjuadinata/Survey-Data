<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#4caf50">
  <title>Formulir Data Ruangan</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3426/3426653.png">
  
  <style>
    html, body {
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f0f8ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
      max-height: 100dvh;
      overflow-y: auto;
      box-sizing: border-box;
    }

    h1 { 
      color: #2c3e50; 
      font-size: 20px; 
      text-align: center; 
      margin-top: 0; 
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #37474f;
      margin-bottom: 4px;
    }

    input[type="text"], 
    input[type="number"], 
    select, 
    textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #b0bec5;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: #fff;
    }

    textarea { 
      height: 60px; 
      resize: none; 
    }

    .input-proyek-wrapper {
      display: flex;
      gap: 6px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      box-sizing: border-box;
    }

    .btn-submit { background-color: #4caf50; color: white; }
    .btn-edit { background-color: #ff9800; color: white; display: none; }
    .btn-download { background-color: #0288d1; color: white; }

    button:disabled { 
      background-color: #9e9e9e; 
      cursor: not-allowed; 
    }

    .result-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      line-height: 1.3;
      font-size: 13px;
      text-align: center;
    }

    .correct { 
      background-color: #e8f5e9; 
      color: #2e7d32; 
      border: 1px solid #a5d6a7; 
    }
    
    .incorrect { 
      background-color: #ffebee; 
      color: #c62828; 
      border: 1px solid #ef9a9a; 
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Formulir Data Ruangan</h1>
  
  <form id="roomForm" onsubmit="simpanData(event, 'insert')">
    
    <!-- NAMA USER -->
    <div class="form-group">
      <label for="namaUser">Nama User / Surveyor</label>
      <input type="text" id="namaUser" placeholder="Contoh: Budi" required onchange="fetchProyekUser()">
    </div>

    <!-- NAMA PROYEK (Dropdown / Input Manual) -->
    <div class="form-group">
      <label for="namaProyek">Nama Proyek</label>
      <div class="input-proyek-wrapper">
        <select id="selectProyek" onchange="syncNamaProyek(this.value)">
          <option value="">-- Ketik Nama User Terlebih Dahulu --</option>
        </select>
        <input type="text" id="namaProyek" placeholder="Atau ketik proyek baru..." required>
      </div>
    </div>

    <!-- NAMA GEDUNG -->
    <div class="form-group">
      <label for="namaGedung">Nama Gedung</label>
      <input type="text" id="namaGedung" placeholder="Contoh: Gedung A / Menara Utama" required>
    </div>

    <!-- NAMA RUANGAN -->
    <div class="form-group">
      <label for="namaRuangan">Nama Ruangan</label>
      <input type="text" id="namaRuangan" placeholder="Contoh: R. Rapat Utama" required>
    </div>

    <!-- LUAS RUANGAN -->
    <div class="form-group">
      <label for="luasRuangan">Luas Ruangan (m²)</label>
      <input type="number" id="luasRuangan" step="0.1" placeholder="Contoh: 25.5" required>
    </div>

    <!-- JENIS SURFACE -->
    <div class="form-group">
      <label for="jenisSurface">Jenis Surface (Permukaan)</label>
      <select id="jenisSurface" required>
        <option value="">-- Pilih Jenis Surface --</option>
        <option value="Keramik">Keramik</option>
        <option value="Vinyl">Vinyl</option>
        <option value="Parquet/Kayu">Parquet / Kayu</option>
        <option value="Karpet">Karpet</option>
        <option value="Beton/Epoxy">Beton / Epoxy</option>
      </select>
    </div>

    <!-- CATATAN -->
    <div class="form-group">
      <label for="catatan">Catatan Tambahan</label>
      <textarea id="catatan" placeholder="Kondisi permukaan, warna, dll."></textarea>
    </div>

    <div class="btn-group">
      <button type="submit" id="btnSubmit" class="btn-submit">Simpan Data Ruangan 💾</button>
      <button type="button" id="btnEdit" class="btn-edit" onclick="kembaliKeDataTerakhir()">✏ Kembalikan & Edit Data Terakhir</button>
      <button type="button" class="btn-download" onclick="unduhSpreadsheetUser()">📥 Unduh Data User Ini (CSV/Excel)</button>
    </div>
  </form>

  <div id="statusPesan" class="result-box"></div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzDGfaC2Ldi19dGuwAP2jg7hTFe6POdpBykclVf90ZaZd1xsosaP6MQiFa4IQqblMMt2A/exec";

  let dataTerakhir = null;

  // 1. Memuat data tersimpan dari localStorage saat halaman dibuka
  function loadSavedInputs() {
    const savedUser = localStorage.getItem("saved_namaUser");
    const savedProyek = localStorage.getItem("saved_namaProyek");
    const savedGedung = localStorage.getItem("saved_namaGedung");

    if (savedUser) {
      document.getElementById("namaUser").value = savedUser;
      fetchProyekUser();
    }
    if (savedProyek) document.getElementById("namaProyek").value = savedProyek;
    if (savedGedung) document.getElementById("namaGedung").value = savedGedung;
  }

  // 2. Mengambil daftar proyek unik yang pernah dibuat oleh User
  function fetchProyekUser() {
    const namaUser = document.getElementById("namaUser").value.trim();
    const selectProyek = document.getElementById("selectProyek");

    if (!namaUser) {
      selectProyek.innerHTML = '<option value="">-- Ketik Nama User Terlebih Dahulu --</option>';
      return;
    }

    selectProyek.innerHTML = '<option value="">Memuat proyek...</option>';

    fetch(WEB_APP_URL + "?action=getProjects&namaUser=" + encodeURIComponent(namaUser))
      .then(res => res.json())
      .then(data => {
        selectProyek.innerHTML = '<option value="">-- Pilih Proyek Yang Ada --</option>';
        if (data.status === "success" && data.projects.length > 0) {
          data.projects.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p;
            opt.textContent = p;
            selectProyek.appendChild(opt);
          });
        } else {
          selectProyek.innerHTML = '<option value="">Belum ada proyek tersimpan</option>';
        }
      })
      .catch(() => {
        selectProyek.innerHTML = '<option value="">Gagal memuat proyek</option>';
      });
  }

  function syncNamaProyek(val) {
    if (val) {
      document.getElementById("namaProyek").value = val;
      localStorage.setItem("saved_namaProyek", val);
    }
  }

  // 3. Fungsi Mengirim / Menyimpan Data
  function simpanData(e, mode = 'insert') {
    if (e) e.preventDefault();

    const btn = document.getElementById("btnSubmit");
    const statusPesan = document.getElementById("statusPesan");
    
    btn.disabled = true;
    btn.innerText = "Menyimpan...";

    const payload = {
      action: mode === 'update' ? 'updateLast' : 'insert',
      namaUser: document.getElementById("namaUser").value.trim(),
      namaProyek: document.getElementById("namaProyek").value.trim(),
      namaGedung: document.getElementById("namaGedung").value.trim(),
      namaRuangan: document.getElementById("namaRuangan").value.trim(),
      luasRuangan: document.getElementById("luasRuangan").value,
      jenisSurface: document.getElementById("jenisSurface").value,
      catatan: document.getElementById("catatan").value.trim()
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      dataTerakhir = { ...payload };

      statusPesan.style.display = "block";
      statusPesan.className = "result-box correct";
      statusPesan.innerText = mode === 'update' ? "✅ Revisi data berhasil diperbarui!" : "✅ Data ruangan berhasil disimpan ke Sheets!";
      
      // Kosongkan hanya detail ruangan
      document.getElementById("namaRuangan").value = "";
      document.getElementById("luasRuangan").value = "";
      document.getElementById("jenisSurface").value = "";
      document.getElementById("catatan").value = "";
      
      const form = document.getElementById("roomForm");
      form.onsubmit = function(ev) { simpanData(ev, 'insert'); };

      document.getElementById("btnEdit").style.display = "block";

      btn.disabled = false;
      btn.innerText = "Simpan Data Ruangan 💾";

      // Refresh daftar proyek
      fetchProyekUser();
    })
    .catch((error) => {
      statusPesan.style.display = "block";
      statusPesan.className = "result-box incorrect";
      statusPesan.innerText = "❌ Gagal menyimpan data: " + error.message;
      btn.disabled = false;
      btn.innerText = "Simpan Data Ruangan 💾";
    });
  }

  // 4. FITUR REVISI
  function kembaliKeDataTerakhir() {
    if (!dataTerakhir) {
      alert("Belum ada data baru yang dimasukkan dalam sesi ini.");
      return;
    }

    document.getElementById("namaUser").value = dataTerakhir.namaUser;
    document.getElementById("namaProyek").value = dataTerakhir.namaProyek;
    document.getElementById("namaGedung").value = dataTerakhir.namaGedung;
    document.getElementById("namaRuangan").value = dataTerakhir.namaRuangan;
    document.getElementById("luasRuangan").value = dataTerakhir.luasRuangan;
    document.getElementById("jenisSurface").value = dataTerakhir.jenisSurface;
    document.getElementById("catatan").value = dataTerakhir.catatan;

    const statusPesan = document.getElementById("statusPesan");
    statusPesan.style.display = "block";
    statusPesan.className = "result-box incorrect";
    statusPesan.innerText = "⚠️ Mode Revisi: Silakan ubah data lalu tekan tombol 'Simpan Data Ruangan'.";

    const form = document.getElementById("roomForm");
    form.onsubmit = function(e) { simpanData(e, 'update'); };
  }

  // 5. FITUR DOWNLOAD SPREADSHEET KHUSUS USER
  function unduhSpreadsheetUser() {
    const namaUser = document.getElementById("namaUser").value.trim();

    if (!namaUser) {
      alert("Silakan isi Nama User terlebih dahulu untuk mengunduh data!");
      return;
    }

    const downloadUrl = WEB_APP_URL + "?action=downloadUserSpreadsheet&namaUser=" + encodeURIComponent(namaUser);
    window.open(downloadUrl, "_blank");
  }

  // 6. Listener Event untuk Memuat & Menyimpan Otomatis ke localStorage
  document.addEventListener("DOMContentLoaded", function() {
    loadSavedInputs();

    document.getElementById("namaUser")?.addEventListener("input", function(e) {
      localStorage.setItem("saved_namaUser", e.target.value);
    });

    document.getElementById("namaProyek")?.addEventListener("input", function(e) {
      localStorage.setItem("saved_namaProyek", e.target.value);
    });

    document.getElementById("namaGedung")?.addEventListener("input", function(e) {
      localStorage.setItem("saved_namaGedung", e.target.value);
    });
  });

  // Registrasi Service Worker PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('PWA Service Worker terdaftar:', reg.scope))
        .catch((err) => console.error('PWA Registrasi gagal:', err));
    });
  }
</script>

</body>
</html>
